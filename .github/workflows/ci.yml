name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Enable the declared npm version
        run: corepack enable npm && node --version && npm --version
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify npm registry signatures
        run: npm audit signatures
      - name: Validate agent harness
        run: npm run test:harness
      - name: Run frontend unit tests
        run: npm test
      # tauri::generate_context! embeds ../dist at compile time — the frontend
      # must exist before ANY cargo step or the macro fails on a clean runner.
      - name: Build frontend
        run: npm run build
      - name: Build Storybook
        run: npm run storybook:build
      # rustup discovers rust-toolchain.toml and installs its pinned compiler,
      # formatter, and linter. Keep local development and CI on one toolchain.
      - name: Install the declared Rust toolchain
        run: rustc --version && cargo --version && cargo clippy --version && cargo fmt --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      # The XMP file-safety tests probe for exiftool and silently skip
      # without it — install so they actually gate.
      - name: Install exiftool
        run: brew install exiftool
      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri
      # The real-model faces fixture (ignored by default so plain `cargo test`
      # stays fast everywhere): actual YuNet+SFace inference on a known face.
      # The pinned .onnx models are committed, so a clean runner can run it —
      # this is what catches silent preprocessing breakage.
      - name: Run bundled-model inference test
        run: cargo test -- --ignored detects_known_face_and_embeds_deterministically
        working-directory: src-tauri
      - name: Build Rust core
        run: cargo build
        working-directory: src-tauri
# The perf/durability gates (scripts/gate.sh: flip-storm, zoomtest) need a
# private real-photo fixture and native host. They stay local release gates;
# CI does not enforce the latency budget.
